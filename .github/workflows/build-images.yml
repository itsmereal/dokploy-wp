name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * 0" # Monday 04:23 Asia/Taipei

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dokploy-wp
  SECURITY_RELEASE: security-20261021

jobs:
  build-and-push:
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
        service:
          - image: wordpress
            context: .
            file: wordpress/Dockerfile
            php: true
          - image: phpmyadmin
            context: .
            file: phpmyadmin/Dockerfile
            php: true
          - image: nginx
            context: ./nginx
            file: nginx/Dockerfile
            php: false
          - image: plugin-installer
            context: ./plugin-installer
            file: plugin-installer/Dockerfile
            php: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native image for validation
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          platforms: ${{ matrix.arch.platform }}
          tags: local/dokploy-wp-${{ matrix.service.image }}:test
          cache-from: type=gha,scope=${{ matrix.service.image }}-${{ matrix.arch.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.image }}-${{ matrix.arch.suffix }}

      - name: Verify patched PHP runtime
        if: matrix.service.php
        env:
          IMAGE: local/dokploy-wp-${{ matrix.service.image }}:test
          SERVICE: ${{ matrix.service.image }}
        run: |
          docker run --rm --network none --entrypoint ensure-patched-php "$IMAGE" --check-only
          if [ "$SERVICE" = wordpress ]; then
            docker run --rm --network none --entrypoint php "$IMAGE" -r '
              foreach (["mysqli", "redis", "gd", "zip", "Zend OPcache"] as $ext) {
                if (!extension_loaded($ext)) { fwrite(STDERR, "Missing extension: $ext\n"); exit(1); }
              }'
            docker run --rm --network none --entrypoint php-fpm "$IMAGE" -t
          else
            docker run --rm --network none --entrypoint php "$IMAGE" -r 'exit(extension_loaded("mysqli") ? 0 : 1);'
            docker run --rm --network none --entrypoint apache2ctl "$IMAGE" -t
          fi

      - name: Verify other container configurations
        if: ${{ !matrix.service.php }}
        env:
          IMAGE: local/dokploy-wp-${{ matrix.service.image }}:test
          SERVICE: ${{ matrix.service.image }}
        run: |
          if [ "$SERVICE" = nginx ]; then
            docker run --rm --network none --entrypoint nginx "$IMAGE" -t
          else
            docker run --rm --network none --entrypoint bash "$IMAGE" -n /install-redis-plugin.sh
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image without rebuilding
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.image }}
          LOCAL_IMAGE: local/dokploy-wp-${{ matrix.service.image }}:test
          ARCH: ${{ matrix.arch.suffix }}
        run: |
          tag="$IMAGE:build-${GITHUB_RUN_ID}-$ARCH"
          docker tag "$LOCAL_IMAGE" "$tag"
          docker push "$tag"

  publish-manifests:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [wordpress, phpmyadmin, nginx, plugin-installer]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested AMD64 and ARM64 images
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
        run: |
          release="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$SECURITY_RELEASE" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:$release" \
            "$IMAGE:build-${GITHUB_RUN_ID}-amd64" "$IMAGE:build-${GITHUB_RUN_ID}-arm64"
          docker buildx imagetools inspect "$IMAGE:$release"
          echo "### $IMAGE:$release" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated natively on AMD64 and ARM64 before publication." >> "$GITHUB_STEP_SUMMARY"
